title: "genesis-framework"
author: "xyzzy@RockingShip.org"
url: https://rockingship.github.io # root address of the site
description: "A working method for writing a long manuscript together with AI agents, across many sessions and many agents"
favicon: /genesis-framework/assets/favicon-32.png
favicon152: /genesis-framework/assets/favicon-152.png
favicon192: /genesis-framework/assets/favicon-192.png

# jekyll settings
remote_theme: RockingShip/moonwalk

# every page gets the navbar and footer
defaults:
  - scope:
      path: ""
    values:
      layout: home

# moonwalk
theme_config:
  appearance: "dark" # can be "light", "dark" or "auto"
  back_home_text: "&#x2343; home" # customize text for homepage link in post layout
  date_format: "%Y-%m-%d" # customize how date is formatted
  date_format_post: "%d %B %Y" # customize how date is formatted for blog post headers
  show_title: false # show title in home page
  show_description: false # show blog description in home page
  show_navbar: true # show horizontal navbar in home page
  show_footer: true # show footer links in home page,add in _data/home.yml
  show_projects: false # show projects as cards, add in _data/home.yml
  show_blog: false # show blog add in _posts
  show_old_projects: false # show old projects as cards, add in _data/home.yml
  show_misc_list: false # show generic vertical list for misc details, add _data/home.yml

highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
